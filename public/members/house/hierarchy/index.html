<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>House Hierarchy | Golden Blades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/hero.css">
</head>
<body data-from="house">
  <header class="site" id="site-header"></header>
  <div class="page-hero"><img src="/members/hero/charge.jpg" alt="The Golden Blades advancing across a field"><div class="hero-text"><h1>Golden Blades Hierarchy</h1><hr class="rule"><p>The regiment's own chain of command. Click a person to read their story.</p></div></div>
  <main class="wrap hrl">
    <figure class="photo-fig coa"><img src="/members/house/heraldry/web/regimental-coat-of-arms.png" alt="Regimental coat of arms of the Golden Blades: two griffins hold a blue and gold shield bearing the five company shields, with the motto Denarii Societas Contractus" loading="lazy"><figcaption>The regimental coat of arms of the Golden Blades.</figcaption></figure>
    <div id="gb-root"></div>
    <p class="hrl-footer-note">Other companies and staff positions will be added as they are confirmed. The ranks and their duties are in the <a href="/members/house/primer/#ranks">Primer</a>. See also the <a href="/members/hrl/hierarchy/">Holy Reman League hierarchy</a>.</p>
      <figure class="photo-fig"><img src="/members/groups/winterwatch-january.jpg" alt="The Golden Blades posed in front of a timber lodge in January" loading="lazy"><figcaption>The regiment at Winter Watch, January.</figcaption></figure>
  </main>
  <footer class="site" id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script src="/members/hrl/people.js"></script>
  <script src="/members/hrl/hrl.js"></script>
  <script>
    (function () {
      var U = window.HRL_UI, D = window.HRL, root = document.getElementById("gb-root");
      var horst = D.electors.filter(function (p) { return p.name.indexOf("Horst") === 0; })[0];
      var oberst = { rank: "Oberst", name: horst.name, role: "Commander of the Golden Blades", photo: horst.photo, crest: "sigil" };
      var anton = { rank: "Former Oberst", name: D.archduke.name, role: "Held the Oberst's seat until 810 AC, when he vacated it to become High Arch Chancellor of the Holy Reman League", photo: D.archduke.photo, crest: "sigil" };
      function find(first) { return U.everyone().filter(function (p) { return p.name.indexOf(first) !== -1; })[0]; }
      var SHIELD = { jaeger: { img: "5e1bf6ad06cdc58ab958bedf57337b21" }, condottiere: { img: "51cd64b9fcae9beffd0ad1edfa793e5c" }, sapper: { img: "81c1a4c0e51b697a86217c217ce77781" }, infantry: { img: "733dbd110875caec60e292cc2a372528" }, marina: { img: "33784bbf3e19d3f600bb3f6e861319ca" } };
      function gb(first, rank, role, crest) {
        var p = find(first);
        return { rank: rank, name: p.name, slug: p.slug, role: role, photo: p.photo, crest: crest || "sigil" };
      }
      var GAP = function () { root.appendChild(U.h("div", "hrl-connector")); };
      root.appendChild(U.tier("Oberst", [oberst], "top"));
      GAP();
      root.appendChild(U.tier("Seat History", [anton], "top"));
      GAP();
      root.appendChild(U.tier("Hauptmanns", [
        gb("Ulric", "Ersterhauptmann", "Infantry Company", SHIELD.infantry),
        gb("Raiken", "Zweiterhauptmann", "Jaeger Company", SHIELD.jaeger),
        gb("Goosetavo", "Vierterhauptmann", "Sapper Corps", SHIELD.sapper),
        { rank: "Seat Vacant", name: "Kommandantin", role: "Marina Mercantile\nLast held by Abigail Winterstone, who left for Lex Talionus", vacant: true, blank: true, crest: SHIELD.marina }
      ], "center"));
      GAP();
      root.appendChild(U.tier("Condottiere Company", [
        gb("“Dr” Alexander", "Condottiere", "Company physician", SHIELD.condottiere),
        gb("Maximo", "Condottiere", "Spell Master General", SHIELD.condottiere)
      ], "center"));
      GAP();
      root.appendChild(U.tier("Regimental Staff", [
        gb("Marklin", "Treasurer", "Regimental Staff"),
        gb("Thaedra", "Intelligence Officer", "High Priestess of Mascirino")
      ], "center"));
      GAP();
      var shown = ["Horst", "Anton", "Ulric", "Raiken", "Goosetavo", "Alexander", "Maximo", "Marklin", "Thaedra"];
      var notBlades = ["Avaline", "Duarte", "Leif", "Ohthere", "Abigail"];
      function has(list, name) { return list.some(function (x) { return name.indexOf(x) !== -1; }); }
      var JAEGERS = ["Boots", "Soluna", "Ghoti"];
      function companyShield(p) {
        if (has(JAEGERS, p.name)) return SHIELD.jaeger;
        return p.crest && p.crest.img ? p.crest : "sigil";
      }
      function sortKey(n) { return n.replace(/^(Sir |\u201cDr\u201d )/, "").toLowerCase(); }
      var blades = U.everyone().filter(function (p) {
        return !has(shown, p.name) && !has(notBlades, p.name);
      }).sort(function (a, b) { return sortKey(a.name) < sortKey(b.name) ? -1 : 1; })
        .map(function (p) { return { rank: p.rank, name: p.name, slug: p.slug, role: p.role, photo: p.photo, crest: companyShield(p), emblem: p.emblem }; });
      root.appendChild(U.tier("Blades", blades, "center"));
    })();
  </script>
</body>
</html>
