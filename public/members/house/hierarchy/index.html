<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>House Hierarchy | Golden Blades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/hero.css">
</head>
<body data-from="house">
  <header class="site" id="site-header"></header>
  <div class="page-hero"><img src="/members/hero/charge.jpg" alt="The Golden Blades advancing across a field"><div class="hero-text"><h1>Golden Blades Hierarchy</h1><hr class="rule"><p>The regiment's own chain of command. Click a person to read their story.</p></div></div>
  <main class="wrap hrl">
    <div id="gb-root"></div>
    <p class="hrl-footer-note">Other companies and staff positions will be added as they are confirmed. The ranks and their duties are in the <a href="/members/house/primer/#ranks">Primer</a>. See also the <a href="/members/hrl/hierarchy/">Holy Reman League hierarchy</a>.</p>
  </main>
  <footer class="site" id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script src="/members/hrl/people.js"></script>
  <script src="/members/hrl/hrl.js"></script>
  <script>
    (function () {
      var U = window.HRL_UI, D = window.HRL, root = document.getElementById("gb-root");
      var horst = D.electors.filter(function (p) { return p.name.indexOf("Horst") === 0; })[0];
      var oberst = { rank: "Oberst", name: horst.name, role: "Commander of the Golden Blades", photo: horst.photo, crest: "sigil" };
      var anton = { rank: "Former Oberst", name: D.archduke.name, role: "Held the Oberst's seat until 810 AC, when he vacated it to become High Arch Chancellor of the Holy Reman League", photo: D.archduke.photo, crest: "sigil" };
      function find(first) { return U.everyone().filter(function (p) { return p.name.indexOf(first) !== -1; })[0]; }
      function gb(first, rank, role) {
        var p = find(first);
        return { rank: rank, name: p.name, slug: p.slug, role: role, photo: p.photo, crest: "sigil" };
      }
      var GAP = function () { root.appendChild(U.h("div", "hrl-connector")); };
      root.appendChild(U.tier("Oberst", [oberst], "top"));
      GAP();
      root.appendChild(U.tier("Seat History", [anton], "top"));
      GAP();
      root.appendChild(U.tier("Hauptmanns", [
        gb("Ulric", "Ersterhauptmann", "Infantry Company"),
        gb("Raiken", "Zweiterhauptmann", "Jaeger Company"),
        gb("Goosetavo", "Vierterhauptmann", "Sapper Corps"),
        { rank: "Seat Vacant", name: "Kommandantin", role: "Marina Mercantile\nLast held by Abigail Winterstone, who left for Lex Talionus", vacant: true, blank: true, crest: "sigil" }
      ], "center"));
      GAP();
      root.appendChild(U.tier("Condottiere Company", [
        gb("“Dr” Alexander", "Condottiere", "Company physician"),
        gb("Maximo", "Condottiere", "Spell Master General")
      ], "center"));
      GAP();
      root.appendChild(U.tier("Regimental Staff", [
        gb("Marklin", "Treasurer", "Regimental Staff"),
        gb("Thaedra", "Intelligence Officer", "High Priestess of Mascirino")
      ], "center"));
      GAP();
      root.appendChild(U.tier("Contractors", (D.contractors || []).map(function (c) {
        return { rank: c.rank, name: c.name, role: c.role, photo: c.photo };
      }), "center"));
    })();
  </script>
</body>
</html>
